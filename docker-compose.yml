version: "3.8"

services:
    fasakhani-app:
        container_name: fasakhani-app-dev
        build:
            context: .
        env_file:
            - ./.env
        volumes:
            - .:/var/www/html
            - /var/www/html/node_modules
            - /var/www/html/vendor
        environment:
            - CHOKIDAR_USEPOLLING=true
            - VITE_APP_URL=http://localhost:5174
            - VITE_HMR_HOST=localhost
            - VITE_HMR_PORT=5174
            - COMPOSER_PROCESS_TIMEOUT=1200
            - VITE_DEV_SERVER_URL=http://localhost:5174
            - VITE_HMR_PROTOCOL=ws
        ports:
            - "9000:9000"
            - "5174:5174"
            - "6001:6001"
        networks:
            - laravel-net
        extra_hosts:
            - "host.docker.internal:host-gateway"

    nginx:
        image: nginx:stable-alpine
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - fasakhani-app
        networks:
            - laravel-net

    database:
        image: mysql:8.0
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        depends_on:
            - fasakhani-app
        networks:
            - laravel-net

networks:
    laravel-net:
        driver: bridge

volumes:
    mysql_data: ~
